name: Deploy furshet-v2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to web-1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            if [ ! -d ~/furshet-v2 ]; then git clone https://github.com/oabaturov-ops/furshet-v2.git ~/furshet-v2; fi
            cd ~/furshet-v2
            git pull
            docker build -t furshet-v2 .
            docker rm -f furshet-v2
            docker run -d --name furshet-v2 --network web --restart unless-stopped -e DATABASE_URL="${{ secrets.DATABASE_URL }}" furshet-v2
            docker image prune -f
            docker builder prune -f